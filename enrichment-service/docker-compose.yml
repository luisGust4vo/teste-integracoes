version: "3.9"

services:
  enrichment:
    build: .
    container_name: enrichment_service
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - mongo
      - rabbitmq
    networks:
      - app-network

  mongo:
    image: mongo:7
    container_name: enrichment_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    external: true
