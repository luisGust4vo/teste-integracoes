version: "3.9"

services:
  app:
    build: .
    container_name: user_service_app
    volumes:
      - .:/var/www
    depends_on:
      - db
      - rabbitmq
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: user_service_nginx
    ports:
      - "3000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: postgres:16
    container_name: user_service_db
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
